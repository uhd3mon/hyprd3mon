# hyprd3mon lock screen (hyprlock 0.9.6, hyprlang syntax)
# d3mon theme: the grid wallpaper (dark or light, via current.png)
# under light blur, big Unbounded clock, round avatar, user name and a
# glass password field. Shown on every monitor (monitor = empty).

$wall   = ~/.local/share/hyprd3mon/wallpapers/current.png
$avatar = ~/.local/share/hyprd3mon/avatar.png

$display = Unbounded
$mono    = JetBrainsMono Nerd Font

# Dark palette defaults, then the generated theme (dark or light
# palette + accent from settings.conf). If that file is missing,
# hyprlock logs an error and keeps these. *_hex = rrggbb for markup.
$bg         = rgba(7, 7, 7, 1.0)
$glass      = rgba(7, 7, 7, 0.78)
$hover      = rgba(255, 255, 255, 0.05)
$line       = rgba(255, 255, 255, 0.07)
$line2      = rgba(255, 255, 255, 0.11)
$ink        = rgba(236, 238, 233, 1.0)
$dim        = rgba(138, 141, 136, 1.0)
$faint      = rgba(84, 87, 82, 1.0)
$bad        = rgba(255, 95, 86, 1.0)
$warn       = rgba(240, 180, 60, 1.0)
$accent     = rgba(145, 230, 17, 1.0)
$dim_hex    = 8a8d88
$bad_hex    = ff5f56
source = ~/.config/hyprd3mon/generated/hyprlock-theme.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2500
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldColors, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = $wall
    color = $bg
    # Blur only lightly so the 1px grid stays faintly visible on both
    # the dark and the light wallpaper.
    blur_passes = 1
    blur_size = 3
    noise = 0.01
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.0
}

# Clock: the one focal point.
label {
    monitor =
    text = $TIME
    color = $ink
    font_size = 108
    font_family = $display
    position = 0, 280
    halign = center
    valign = center
}

# Date: small tracked mono, uppercase.
label {
    monitor =
    text = cmd[update:60000] date +"%A  %d %B" | tr '[:lower:]' '[:upper:]'
    color = $dim
    font_size = 13
    font_family = $mono
    position = 0, 170
    halign = center
    valign = center
}

# Glass card behind the login block.
shape {
    monitor =
    size = 380, 300
    color = $glass
    rounding = 20
    border_size = 1
    border_color = $line2
    position = 0, -70
    halign = center
    valign = center
}

# Avatar: round, hairline ring.
image {
    monitor =
    path = $avatar
    size = 96
    rounding = -1
    border_size = 2
    border_color = $line2
    position = 0, 10
    halign = center
    valign = center
}

# User name.
label {
    monitor =
    text = $USER
    color = $ink
    font_size = 15
    font_family = $display
    position = 0, -70
    halign = center
    valign = center
}

# Password field. hyprlock keeps it focused while locked, so the
# accent outline is the focus ring: amber while checking, red with
# the fail text.
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 14
    inner_color = $hover
    outer_color = $accent
    check_color = $warn
    fail_color = $bad
    capslock_color = $ink
    font_color = $ink
    font_family = $mono
    fade_on_empty = false
    placeholder_text = <span foreground="##$dim_hex">Password</span>
    fail_text = <span foreground="##$bad_hex">$PAMFAIL ($ATTEMPTS)</span>
    check_text = <span foreground="##$dim_hex">Checking</span>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -145
    halign = center
    valign = center
}

# Brand mark, bottom centre, lowercase.
label {
    monitor =
    text = d3mon
    color = $faint
    font_size = 11
    font_family = $display
    position = 0, 36
    halign = center
    valign = bottom
}
