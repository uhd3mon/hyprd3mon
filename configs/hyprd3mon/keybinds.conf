# hyprd3mon keybind overrides. Only changed binds go here; everything
# else keeps its default. Easiest: Settings (gear) > Keybinds.
# Format: id = MODS + KEY   (mods: SUPER SHIFT CTRL ALT)
# Use `none` to switch a bind off. The ids are listed by the help (?)
# button and in ~/.cache/hyprd3mon/keybinds.tsv.
#
# launcher = SUPER + D
# shot_region = SUPER + SHIFT + X
