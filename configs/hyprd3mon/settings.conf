# hyprd3mon settings. Change these from the bar's gear menu
# (hyprd3mon-settings) or edit by hand, then run hyprd3mon-apply-settings.
# The installer never overwrites this file.

# Theme: dark or light (bar, menus, terminal, lock, wallpaper, GTK).
theme=dark

# Accent colour: auto (the theme's own: lime on dark, green on light)
# or #rrggbb. Used by window borders, bar highlights, menus and lock.
accent=auto

# Clock: 24h or 12h.
clock=24h

# Top bar modules: on or off. Username, clock and power always show.
bar_taskbar=on
bar_network=on
bar_sound=on
bar_help=on
bar_settings=on
bar_tray=on
