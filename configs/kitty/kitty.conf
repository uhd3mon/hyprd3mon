# hyprd3mon kitty: d3mon theme. Solid when focused; Hyprland turns
# unfocused windows into frosted glass.
# Muted 16-colour palette; the accent is the only loud colour.
#
# Colours below are the dark fallback. The settings generator writes
# ../hyprd3mon/generated/kitty-theme.conf (dark or light palette +
# accent), included at the end so it overrides them. If it is
# missing, kitty logs it and keeps these.

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
disable_ligatures cursor

# Opacity (frosting comes from Hyprland) + space
background_opacity         1.0
dynamic_background_opacity yes
window_padding_width       14 18
hide_window_decorations    yes
confirm_os_window_close    0

# Cursor + bell
cursor_shape          beam
cursor_blink_interval 0.6
enable_audio_bell     no
visual_bell_duration  0

# Base (all colours are overridden by kitty-theme.conf)
foreground           #eceee9
background           #070707
selection_foreground #0b1400
selection_background #91e611
cursor               #91e611
cursor_text_color    #0b1400
url_color            #91e611
url_style            single

# Splits + tabs
active_border_color   #91e611
inactive_border_color #545752
bell_border_color     #ff5f56
tab_bar_edge          top
tab_bar_style         separator
tab_separator         "  "
tab_title_template    " {index} {title} "
active_tab_foreground   #0b1400
active_tab_background   #91e611
active_tab_font_style   bold
inactive_tab_foreground #8a8d88
inactive_tab_background #0d0d0e
inactive_tab_font_style normal
tab_bar_background      #070707

# 16 colours: black, red, green, yellow, blue, magenta, cyan, white
color0  #0d0d0e
color8  #545752

color1  #ff5f56
color9  #ff8a83

color2  #91e611
color10 #b4f24f

color3  #f0b43c
color11 #f5c96b

color4  #7d9fbf
color12 #a3bdd6

color5  #b08cab
color13 #c9aac4

color6  #6fb5a6
color14 #96cbbf

color7  #c6c9c3
color15 #eceee9

# Keep shell integration defaults; no remote control needed.
allow_remote_control no

# Theme + accent from settings.conf (every colour above). Must stay
# last.
include ../hyprd3mon/generated/kitty-theme.conf
