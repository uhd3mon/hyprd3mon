# hyprd3mon palette: light (Workspace app light tokens, d3mon theme).
# Bash-sourceable KEY=VALUE. Read by bin/hyprd3mon-apply-settings and
# hyprland.lua; installed to ~/.local/share/hyprd3mon/themes/.

# Surfaces: frosted white glass over the light grid.
bg=#f2f3ef
bg2=#eaece6
panel=#fbfbf9
panel2=#f4f5f1
raise=#e6e8e2
glass="rgba(250,250,247,0.72)"
glass_strong="rgba(251,251,249,0.96)"
hover="rgba(0,0,0,0.05)"
line="rgba(0,0,0,0.09)"
line2="rgba(0,0,0,0.16)"
shadow="rgba(16,18,14,0.18)"

# Text + states
ink=#10120e
ink2=#32352f
dim=#5c6058
faint=#8d9188
ok=#3a7d00
warn=#a35f00
bad=#c42b1f
bad_soft="rgba(196,43,31,0.10)"

# Accent (accent=auto in settings.conf)
accent_default=#4f8f00
accent_ink_default=#ffffff

# Waybar calendar tooltip ("today" = accent)
cal_months=#10120e
cal_weekdays=#5c6058
cal_days=#32352f

# Terminal (kitty). cursor/selection follow the accent; these are
# the values for accent=auto. Every colour reads on term_bg; 7/15
# are greys, not white, so "white" text stays visible.
term_bg=#fafaf7
term_fg=#10120e
term_cursor=#4f8f00
selection_bg=#4f8f00
selection_fg=#ffffff
# black red green yellow blue magenta cyan white; 8-15 = bright
color0=#10120e
color1=#c42b1f
color2=#3a7d00
color3=#8a5a00
color4=#2a5f96
color5=#8a3f88
color6=#1f7a6c
color7=#5c6058
color8=#6c7068
color9=#a8231a
color10=#2f6a00
color11=#7a4f00
color12=#1f4f84
color13=#743272
color14=#18685c
color15=#32352f

# System
gtk_scheme=prefer-light
gtk_theme=Adwaita
icon_theme=Papirus-Light
wallpaper=grid-light.png
hypr_inactive_border="rgba(0000002e)"
