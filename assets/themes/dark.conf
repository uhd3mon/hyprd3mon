# hyprd3mon palette: dark (Workspace app dark tokens, d3mon theme).
# Bash-sourceable KEY=VALUE. Read by bin/hyprd3mon-apply-settings and
# hyprland.lua; installed to ~/.local/share/hyprd3mon/themes/.

# Surfaces
bg=#070707
bg2=#0a0a0b
panel=#0d0d0e
panel2=#111112
raise=#141415
glass="rgba(7,7,7,0.78)"
glass_strong="rgba(13,13,14,0.96)"
hover="rgba(255,255,255,0.05)"
line="rgba(255,255,255,0.07)"
line2="rgba(255,255,255,0.11)"
shadow="rgba(0,0,0,0.55)"

# Text + states
ink=#eceee9
ink2=#c6c9c3
dim=#8a8d88
faint=#545752
ok=#6fd13a
warn=#f0b43c
bad=#ff5f56
bad_soft="rgba(255,95,86,0.12)"

# Accent (accent=auto in settings.conf)
accent_default=#91e611
accent_ink_default=#0b1400

# Waybar calendar tooltip ("today" = accent)
cal_months=#eceee9
cal_weekdays=#8a8d88
cal_days=#c6c9c3

# Terminal (kitty). cursor/selection follow the accent; these are
# the values for accent=auto.
term_bg=#070707
term_fg=#eceee9
term_cursor=#91e611
selection_bg=#91e611
selection_fg=#0b1400
# black red green yellow blue magenta cyan white; 8-15 = bright
color0=#0d0d0e
color1=#ff5f56
color2=#91e611
color3=#f0b43c
color4=#7d9fbf
color5=#b08cab
color6=#6fb5a6
color7=#c6c9c3
color8=#545752
color9=#ff8a83
color10=#b4f24f
color11=#f5c96b
color12=#a3bdd6
color13=#c9aac4
color14=#96cbbf
color15=#eceee9

# System
gtk_scheme=prefer-dark
gtk_theme=Adwaita-dark
icon_theme=Papirus-Dark
wallpaper=grid-dark.png
hypr_inactive_border="rgba(ffffff1a)"
